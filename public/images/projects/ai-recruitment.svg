<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="AI Recruitment Platform">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="800" height="500"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="800" height="500" fill="#F1EBDC"/>
    <!-- left panel: pipeline -->
    <rect x="48" y="64" width="560" height="396" rx="18" fill="#FFFFFF" stroke="#E4DFD0"/>
    <!-- header row -->
    <rect x="48" y="64" width="560" height="70" rx="18" fill="#FFFFFF"/>
    <rect x="48" y="116" width="560" height="18" fill="#EAE3D1"/>
    <circle cx="84" cy="92" r="12" fill="#46583A"/>
    <rect x="108" y="82" width="150" height="20" rx="10" fill="#F7F4EC"/>
    <rect x="470" y="80" width="110" height="24" rx="12" fill="#46583A"/>
    <text x="525" y="96" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SHORTLIST</text>
    <!-- stage cards -->
    <g>
      <rect x="80" y="170" width="150" height="88" rx="12" fill="#F7F4EC" stroke="#E4DFD0"/>
      <text x="100" y="205" font-family="monospace" font-size="13" fill="#1B1D19">CV INTAKE</text>
      <rect x="100" y="220" width="90" height="8" rx="4" fill="#D2C9B2"/>
      <rect x="100" y="232" width="60" height="8" rx="4" fill="#E4DFD0"/>
    </g>
    <g>
      <rect x="254" y="170" width="150" height="88" rx="12" fill="#F7F4EC" stroke="#E4DFD0"/>
      <text x="274" y="205" font-family="monospace" font-size="13" fill="#1B1D19">AI EVAL</text>
      <rect x="274" y="220" width="90" height="8" rx="4" fill="#C1663F" opacity="0.55"/>
      <rect x="274" y="232" width="70" height="8" rx="4" fill="#D2C9B2"/>
    </g>
    <g>
      <rect x="356" y="170" width="150" height="88" rx="12" fill="#F7F4EC" stroke="#E4DFD0"/>
      <text x="376" y="205" font-family="monospace" font-size="13" fill="#1B1D19">INTERVIEW</text>
      <rect x="376" y="220" width="90" height="8" rx="4" fill="#D2C9B2"/>
      <rect x="376" y="232" width="40" height="8" rx="4" fill="#E4DFD0"/>
    </g>
    <!-- candidate rows -->
    <g font-family="monospace" font-size="11" fill="#5E5B52">
      <rect x="80" y="272" width="460" height="40" rx="8" fill="#FFFFFF" stroke="#EAE3D1"/>
      <circle cx="96" cy="288" r="9" fill="#D2C9B2"/>
      <text x="112" y="292">candidate — 94</text>
      <rect x="430" y="284" width="44" height="14" rx="7" fill="#46583A" opacity="0.85"/>
      <rect x="80" y="322" width="460" height="40" rx="8" fill="#FFFFFF" stroke="#EAE3D1"/>
      <circle cx="96" cy="336" r="9" fill="#D2C9B2"/>
      <text x="112" y="336">candidate — 87</text>
      <rect x="430" y="330" width="44" height="14" rx="7" fill="#E4DFD0"/>
      <rect x="80" y="362" width="460" height="40" rx="8" fill="#FFFFFF" stroke="#EAE3D1"/>
      <circle cx="96" cy="378" r="9" fill="#D2C9B2"/>
      <text x="112" y="382">candidate — 81</text>
      <rect x="430" y="376" width="44" height="14" rx="7" fill="#E4DFD0"/>
    </g>
    <!-- score dial -->
    <g transform="translate(660,140)">
      <circle r="52" fill="none" stroke="#E4DFD0" stroke-width="14"/>
      <path d="M -52 0 A 52 52 0 1 1 26 -45" fill="none" stroke="#46583A" stroke-width="14" stroke-linecap="round"/>
      <text y="8" font-family="monospace" font-size="20" font-weight="bold" fill="#1B1D19" text-anchor="middle">92</text>
      <text y="34" font-family="monospace" font-size="10" fill="#8C8778" text-anchor="middle">MATCH SCORE</text>
    </g>
    <!-- footer chip -->
    <rect x="650" y="330" width="120" height="96" rx="14" fill="#46583A"/>
    <text x="710" y="372" font-family="monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AZURE AI</text>
    <rect x="674" y="390" width="70" height="8" rx="4" fill="#FFFFFF" opacity="0.4"/>
    <text x="710" y="412" font-family="monospace" font-size="10" fill="#F1EBDC" text-anchor="middle" opacity="0.8">-30% manual work</text>
    <!-- clay accent underline -->
    <path d="M 60 470 C 240 462, 480 474, 560 468" stroke="#C1663F" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
